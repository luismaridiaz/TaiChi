  const ALT48 = {"1": {"f": "Transición a paso vacío trasero (gira ligeramente el cuerpo).", "b": "El peso se carga atrás. Un brazo protege la frente (como ala levantada) y el otro baja junto al muslo en diagonal."}, "2": {"f": "Postura de arquero con la pierna izquierda adelante.", "b": "La mano izquierda cepilla o pasa rozando la rodilla izquierda hacia adelante, mientras la palma derecha empuja al frente con fuerza de cadera."}, "3": {"f": "Arco y flecha amplio hacia la izquierda.", "b": "Giro de cintura. La mano izquierda adopta forma de \"gancho\" (dedos juntos hacia arriba) y la mano derecha empuja hacia el lado con la palma abierta."}, "4": {"f": "Paso vacío sobre el talón izquierdo.", "b": "El torso se endereza y gira ligeramente. El talón izquierdo toca el suelo, el brazo izquierdo se estira hacia adelante con el codo semiflexionado y la mano derecha se ubica cerca del codo izquierdo."}, "5": {"f": "Alternancia rítmica entre postura de arquero y retroceso de peso.", "b": "Movimientos fluidos de aplicación defensiva y ofensiva enlazando la retracción de brazos (Lu), la presión hacia adelante (Ji) y el empuje (An)."}, "6": {"f": "Paso de arquero izquierdo.", "b": "Desvías con el puño/antebrazo izquierdo, bloqueas con la mano derecha y lanzas un golpe de puño frontal con la mano izquierda (sincronizado con la rotación de la cintura)."}, "7": {"f": "Postura de arquero.", "b": "Secuencia clásica de cuatro energías (Peng, Lu, Ji, An): ward-off (parar hacia afuera), roll-back (girar hacia atrás), press (presionar) y push (empujar)."}, "8": {"f": "Postura de arquero inclinada hacia la diagonal.", "b": "El hombro y la espalda se inclinan ligeramente hacia adelante guiados por el giro del torso para golpear con el hombro/espalda."}, "9": {"f": "Paso vacío con el pie derecho (apoyando la punta).", "b": "El brazo izquierdo forma una línea bajo el codo derecho, mientras el puño derecho queda listo para golpear hacia abajo de forma sorpresiva."}, "10": {"f": "Se camina hacia atrás alternadamente paso a paso apoyando primero la punta del pie y luego asentando el talón.", "b": "El torso gira suavemente mientras los brazos alternan empujando hacia atrás con la palma abierta y protegiendo el pecho."}, "11": {"f": "Giro sobre los talones cambiando la orientación del cuerpo a la diagonal opuesta en postura de arquero.", "b": "Rotación amplia de 180 grados culminando en un empuje firme con ambas palmas al frente."}, "12": {"f": "Paso vacío sobre el talón derecho.", "b": "Similar al movimiento 5 pero invertido hacia el lado derecho."}, "13": {"f": "Postura de arquero profunda.", "b": "La mano izquierda cepilla la rodilla mientras el puño derecho desciende en un golpe vertical hacia las zonas bajas del oponente."}, "14": {"f": "Paso adelantado deslizando la pierna en posición baja.", "b": "El tronco desciende ligeramente y los dedos de la mano derecha realizan un movimiento de \"aguijón\" o estocada rápida a la altura de los ojos."}, "15": {"f": "Se eleva la pierna en patada circular exterior y se aterriza en postura de arquero baja.", "b": "La palma de la mano golpea el empeine del pie en el aire (palmada al pie) para luego descender en un puñetazo semicircular hacia el suelo (\"domar al tigre\")."}, "16": {"f": "Giro del torso con peso en la pierna trasera.", "b": "El cuerpo se retuerce levemente hacia la diagonal mientras el puño parte desde atrás en un golpe de revés descendente."}, "17": {"f": "Postura baja lateral (estilo \"bajada de serpiente\" o pubu).", "b": "Una pierna se estira completamente hacia el lado y la otra flexiona al máximo. El torso se inclina lateralmente pasando el brazo por la ingle."}, "18": {"f": "Equilibrio total sobre una pierna (la otra rodilla sube flexionada).", "b": "Cuerpo completamente erguido. Una palma se eleva apoyándose hacia arriba mientras la rodilla contraria asciende para proteger el centro."}, "19": {"f": "Arco y flecha hacia la derecha.", "b": "Simétrico al movimiento 4, con gancho a la derecha y palma estirada a la izquierda."}, "20": {"f": "Desplazamiento lateral paso a paso coordinado (paso lateral y cierre).", "b": "Las manos se mueven de forma fluida frente al rostro y al abdomen imitando nubes flotando, con rotaciones suaves de la cintura."}, "21": {"f": "Paso de arquero dinámico en avance diagonal.", "b": "Los brazos se abren diagonalmente como si separaras la crin de un caballo; un brazo sube protegiendo la frente y el otro se extiende a la altura de la cadera."}, "22": {"f": "Paso vacío corto con el pie derecho al frente.", "b": "El torso se alza ligeramente; la palma derecha queda a la altura de los ojos en forma de golpe cortante y la mano izquierda descansa en la cadera."}, "23": {"f": "Apoyo total en la pierna izquierda mientras la pierna derecha patea controladamente al frente.", "b": "Las manos se abren hacia los lados en cruz horizontal para mantener el equilibrio mientras el talón empuja hacia el frente."}, "24": {"f": "Aterrizaje de la patada en postura de arquero profunda.", "b": "Ambos puños avanzan en un movimiento semicircular hacia las sienes o los oídos del oponente imaginario."}, "25": {"f": "Equilibrio sobre pierna derecha y patada de talón con la izquierda.", "b": "Similar a la patada anterior pero con el lado izquierdo."}, "26": {"f": "Cambio rápido de peso en postura de arquero.", "b": "Una mano tapa o desvía y la otra golpea con el puño de forma explosiva aprovechando el giro de la cadera."}, "27": {"f": "Paso vacío hacia adelante con ligera flexión de la rodilla trasera.", "b": "El torso se inclina hacia adelante de manera vertical y recta; un brazo desciende imitando clavar una aguja hacia el suelo."}, "28": {"f": "Postura de arquero.", "b": "El brazo se eleva y arquea por encima de la cabeza y la espalda simulando la apertura de un abanico para golpear de forma diagonal."}, "29": {"f": "Apoyo firme en una pierna y patada con el empeine (punta del pie) estirado.", "b": "Los brazos se extienden en cruz para equilibrar el tronco durante la elevación de la pierna."}, "30": {"f": "Postura de arquero secuencial.", "b": "Repetición del principio clásico de cepillar rodilla con empuje de palma."}, "31": {"f": "Paso de avance corto en arco y flecha.", "b": "La mano adelantada simula un agarre (controlando el brazo del rival) y la posterior golpea con el puño por dentro."}, "32": {"f": "Retroceso de peso hacia la pierna trasera en postura de arquero.", "b": "Los antebrazos se cruzan frente al pecho y luego se extienden hacia adelante en un doble empuje defensivo y neutralizador."}, "34": {"f": "Giro de cintura con carga de peso atrás.", "b": "Bloqueo y contraataque de puño hacia la diagonal derecha."}, "35": {"f": "Pasos de arquero en diagonales alternas (derecha e izquierda).", "b": "Conocido como \"la doncella teje en el telar\". Un brazo protege la frente en diagonal alta y el otro empuja al frente a la altura del pecho."}, "36": {"f": "Retroceso coordinado paso a paso con la planta del pie.", "b": "La palma se desliza y se proyecta hacia adelante desde una posición baja de defensa."}, "37": {"f": "Paso vacío profundo (Xubu).", "b": "El torso desciende de manera controlada mientras la palma presiona suavemente hacia el suelo frente al pie adelantado."}, "38": {"f": "Postura de equilibrio sobre una pierna.", "b": "Elevación de la rodilla contraria y soporte con la palma hacia arriba en gesto de sostenimiento."}, "39": {"f": "Posición del caballo profunda (Mabu).", "b": "El torso se inclina lateralmente para golpear y apoyarse con el hombro y la espalda en postura amplia."}, "40": {"f": "Giro dinámico sobre los talones cambiando el peso de una pierna a otra.", "b": "Desvío circular amplio (Da Lu) para disipar una fuerza externa de gran magnitud."}, "41": {"f": "Posición baja de serpiente (Pubu).", "b": "Movimiento de barrido ascendente con la palma seguido de un descenso corporal pronunciado."}, "42": {"f": "Paso de avance en postura de arquero corta.", "b": "Los puños se cruzan enfrente del pecho al ejecutar el golpe de impacto frontal."}, "43": {"f": "Equilibrio sobre la pierna derecha, rodilla izquierda elevada o arqueada hacia afuera.", "b": "El torso se mantiene erguido mientras los brazos simulan rodear o sujetar el lomo de un tigre."}, "44": {"f": "Giro completo de 360 grados terminando en una patada circular exterior descendente amplia (Barrido de loto).", "b": "Los brazos acompañan el giro centrífugo y las palmas golpean el pie en su recorrido descendente."}, "45": {"f": "Postura de arquero amplia orientada hacia el lado opuesto de la patada.", "b": "Un puño simula sostener el arco y el otro puño se estira hacia atrás simulando tensar la cuerda."}, "46": {"f": "Postura de arquero derecha.", "b": "Repetición simétrica de la secuencia defensiva y ofensiva de puño vista en el movimiento 7 pero hacia el flanco derecho."}, "47": {"f": "Postura de arquero derecha.", "b": "Ciclo completo de energías (Peng, Lu, Ji, An) ejecutado hacia el lado derecho."}, "48": {"f": "Pies paralelos a la anchura de los hombros.", "b": "Los brazos se elevan describiendo un círculo suave al frente, las manos se cruzan frente al pecho con las palmas hacia adentro y descienden lentamente a los costados, devolviendo el cuerpo al estado de calma y cerrando la forma."}};
  /* Fichas contrastadas con el libro oficial «太极拳运动» (人民体育出版社, 1995): los 25 movimientos sin equivalente en la 24 */
  const V48 = {"5": {"reps": "3 veces (derecha, izquierda, derecha)", "st": ["arco"], "feet": "Cada repetición: arco, el peso se retira atrás para el 捋 (tirar), el pie trasero se recoge junto al otro, se da un paso en diagonal apoyando primero el talón y se asienta en arco para el 挤 (presionar). Para pasar al otro lado, el peso va atrás, la punta del pie delantero se levanta y gira hacia dentro, y se vuelve a asentar en arco.", "hands": "Una palma sale por encima del antebrazo contrario y «borra» en horizontal hacia delante (平抹). Después las dos palmas tiran hacia abajo y atrás (捋), a la cadera y al abdomen. Los antebrazos giran y suben al pecho con las palmas enfrentadas, y las dos manos salen juntas hacia delante (挤): la palma de atrás se apoya en la muñeca de la de delante, con los brazos redondos.", "body": "Las manos no se abren más allá del ancho del cuerpo. El tirar va con el recoger del pie, y el presionar con el arco. Si cuesta mantener el equilibrio, apoya la punta del pie junto al pie de apoyo antes de dar el paso.", "cue": "Tirar atrás · recoger · presionar al frente (×3)", "note48": ""}, "8": {"reps": "1 vez", "st": ["arco"], "feet": "El peso pasa a la pierna derecha y el pie izquierdo gira la punta hacia dentro. El pie derecho se recoge junto al izquierdo y sale un paso en diagonal con el talón. El peso va delante y la pierna izquierda se estira: arco derecho.", "hands": "Los brazos se abren a los lados con las palmas al frente. Las muñecas se cruzan ante el cuerpo (derecha por fuera), las manos se cierran en puño y se separan: el puño derecho sube junto a la frente (sien derecha) y el izquierdo baja a la cadera izquierda.", "body": "El torso queda girado hacia el lado contrario al del arco; el 靠 es un golpe con hombro y espalda. Hombros y caderas sueltos, brazos con ligera tensión hacia fuera, sin inclinar el tronco hacia un lado.", "cue": "Abrir los brazos · cruzar · separar en diagonal", "note48": ""}, "9": {"reps": "1 vez", "st": ["vacio"], "feet": "El peso pasa a la pierna izquierda (la punta derecha se levanta y gira hacia dentro), luego a la derecha, y el pie izquierdo se recoge. Se da un paso a la izquierda abriendo el pie (talón primero) y el pie derecho sigue con la punta apoyada detrás. Termina en paso vacío izquierdo, con el talón al frente.", "hands": "La palma izquierda sube a la altura de la nariz y se estira al frente como palma de canto (dedos a la altura de las cejas). El puño derecho queda bajo el codo izquierdo, algo hacia la derecha, con el ojo del puño hacia arriba.", "body": "Todo en un solo flujo, con la cintura como eje. Al terminar, hombros y codos sueltos, ligero hundimiento y el pecho abierto.", "cue": "Palma de canto al frente · puño bajo el codo", "note48": ""}, "11": {"reps": "4 veces (hacia las cuatro esquinas)", "st": ["vacio"], "feet": "Cuatro giros con empuje, alternando izquierda, derecha, izquierda, derecha. En cada uno: el pie se recoge detrás, se gira sobre la punta de un pie y el talón del otro, se da un paso y el otro pie lo sigue quedando con la punta apoyada detrás (paso en T, 丁步). Los dos primeros miran a un par de esquinas opuestas y los dos siguientes al otro par.", "hands": "La palma de delante barre (搂) por delante de la rodilla y queda en la cadera con los dedos al frente. La otra palma empuja desde el lado de la oreja, con la palma al frente y los dedos a la altura de la nariz. Durante el giro, una palma sube a la altura de la cabeza y la otra baja al pecho.", "body": "En el paso en T los pies quedan a unos 10 cm uno del otro, a lo largo y a lo ancho, para poder girar. Al girar, el peso está entre los dos pies; después pasa a la pierna de atrás. Ligero y estable a la vez.", "cue": "Girar a la esquina · paso en T · empujar (×4)", "note48": ""}, "12": {"reps": "1 vez", "st": ["vacio"], "feet": "El pie izquierdo retrocede medio paso (algo a la izquierda) y el peso pasa a esa pierna. El pie derecho se adelanta un poco con el talón apoyado: paso vacío derecho.", "hands": "La mano derecha queda al frente como palma de canto, con los dedos a la altura de las cejas y la palma hacia la izquierda. La izquierda se junta por dentro del brazo derecho, con la palma hacia la derecha y frente al codo derecho.", "body": "Los brazos se hunden y se cierran con suavidad. Cabeza recta, cuello erguido, cintura y hombros sueltos. Es la imagen especular del 左琵琶势.", "cue": "Paso vacío derecho · cerrar los brazos", "note48": ""}, "13": {"reps": "1 vez", "st": ["arco"], "feet": "El pie derecho se recoge delante del izquierdo con la punta apoyada, avanza medio paso y el izquierdo lo sigue con la punta detrás. El peso va atrás a la pierna izquierda y, al final, el pie derecho da un paso al frente hasta un arco derecho con la pierna izquierda estirada (拗弓步: mano y pie contrarios).", "hands": "Las manos tiran hacia el abdomen, suben al pecho y dibujan un círculo horizontal. La izquierda sube a la altura de la cabeza con la palma arriba y la derecha cruza por delante de la cara y baja al pecho izquierdo. Al final, la palma derecha cepilla por delante de la rodilla derecha y se queda en la cadera. El puño izquierdo sale junto a la oreja hacia delante y abajo (栽捶, «plantar el puño»), con la cara del puño hacia delante y abajo, a la altura del abdomen.", "body": "Los brazos alternan círculos horizontales y verticales guiados por la cintura. El torso no se inclina al frente. En el arco «torcido» conviene dejar buena separación lateral entre los pies para mantener la estabilidad.", "cue": "Cepillar la rodilla · puño que planta hacia abajo", "note48": ""}, "14": {"reps": "2 veces (izquierda y derecha)", "st": ["cruzado"], "feet": "Paso cruzado (歇步): la rodilla de atrás casi toca el hueco de la rodilla de delante, piernas semiflexionadas y peso algo adelante. Para entrar, el pie izquierdo se levanta y gira hacia fuera en el sitio, bajando delante del cuerpo (no se arrastra). Se repite al otro lado.", "hands": "Una palma empuja al frente desde junto a la oreja, a la altura del pecho y con la palma al frente. La otra baja y se recoge en la cintura con la palma arriba. En la segunda vez se invierten.", "body": "Gira y avanza con el torso recto, sin torcerlo. En el paso cruzado ambas piernas quedan semiflexionadas.", "cue": "Paso cruzado · palma al frente, otra a la cintura (×2)", "note48": ""}, "15": {"reps": "2 veces (derecha e izquierda)", "st": ["uno", "arco"], "feet": "Paso corto de apoyo hacia delante (垫步) y la pierna de apoyo se asienta; el otro pie sube en patada al frente con el empeine estirado. Se recoge la pierna, baja con un paso cruzado (盖步) hacia el lado contrario y se pasa a un arco. Aterriza suave, sin saltar ni caer lejos. Después se repite con la otra pierna.", "hands": "En la patada, la palma del mismo lado golpea el empeine y la otra mano se abre atrás a la altura del hombro, con la palma hacia fuera. Al bajar, las dos palmas oscilan en horizontal, bajan y se cierran en puño. Terminan cruzadas: un puño junto a la frente y el otro junto a las costillas del lado contrario, mirando al frente (la parte de «montar el tigre», 伏虎).", "body": "Antes de patear, brazos y paso van coordinados, sin sacar el pecho. La altura de la patada depende de cada persona: no te dobles ni retengas el aire para llegar más alto. Tras la patada, recoge primero la pierna y luego da el paso. Con poco equilibrio o rodillas delicadas, haz la patada más baja.", "cue": "Patada con palmada · bajar en arco · puños cruzados", "note48": ""}, "16": {"reps": "1 vez", "st": ["arco"], "feet": "El peso va atrás y el pie derecho gira la punta hacia dentro (sin pasarse). El peso vuelve a la derecha y el pie izquierdo se recoge junto al derecho. Después se da un paso hacia delante a la izquierda hasta un arco izquierdo.", "hands": "Las palmas se cruzan, dibujan círculos y se recogen. La izquierda se cierra en puño a la altura del vientre bajo, sube por delante de la cara y golpea hacia delante con el dorso del puño (撇拳), a la altura de la cabeza y con el puño hacia arriba. La palma derecha queda pegada por dentro del antebrazo izquierdo.", "body": "El giro de la cintura lleva el golpe. Al recoger, las manos se cruzan dibujando un círculo y el puño se cierra mientras se recoge, sin tirón. La palma izquierda sale al frente en la línea de la forma.", "cue": "Cruzar y recoger · golpe con el dorso del puño", "note48": ""}, "17": {"reps": "1 vez", "st": ["bajo"], "feet": "El peso va atrás y la punta del pie izquierdo se levanta y se abre un poco. El peso pasa adelante y el pie derecho se recoge junto al izquierdo. La pierna izquierda se dobla a fondo y la derecha se extiende hacia el lado en postura baja (仆步). Primero se flexiona la izquierda y luego sale la derecha, sin arrastrar el talón. Ambos pies, planos en el suelo.", "hands": "Las manos dibujan círculos verticales y se cierran en puño: el izquierdo ante el abdomen y el derecho ante la cara. Luego el antebrazo derecho baja y el puño izquierdo sube por fuera de él. Al girar el torso a la derecha, el puño derecho atraviesa (穿) hacia delante por la cara interna de la pierna derecha y el izquierdo se estira atrás y arriba, ambos con el ojo del puño hacia arriba.", "body": "Mirada al frente; sin bajar la cabeza ni encorvar la cintura. Con rodillas delicadas o mayores, baja menos (semi-仆步, con la pierna izquierda semiflexionada).", "cue": "Bajar a postura baja · puño que atraviesa por la pierna", "note48": ""}, "18": {"reps": "2 veces (izquierda y derecha)", "st": ["uno"], "feet": "Primero apoyo en la pierna derecha, con la rodilla izquierda subida al frente y el pie relajado (独立步). Después el pie izquierdo baja un paso al frente y el apoyo pasa a la izquierda, con la rodilla derecha arriba. La pierna de apoyo siempre ligeramente flexionada, sin bloquear la rodilla.", "hands": "La mano del mismo lado que la rodilla levantada queda sobre la cabeza (撑掌: dedos hacia el otro lado y palma oblicua hacia arriba); sube pasando por dentro del antebrazo contrario. La otra palma presiona hacia abajo junto a la cadera del lado de apoyo, con los dedos hacia el lado contrario.", "body": "El reto es el equilibrio: rodilla de apoyo blanda, torso erguido, cabeza hacia arriba, todo suelto. La subida del brazo va con un ligero giro de cintura. Si hace falta, apóyate cerca de una pared.", "cue": "Rodilla arriba · palma sobre la cabeza · otra palma abajo", "note48": ""}, "26": {"reps": "1 vez", "st": ["arco"], "feet": "El pie izquierdo se recoge junto al derecho con la punta apoyada y luego sale un paso en diagonal con el talón. El peso pasa a la izquierda: arco izquierdo con la pierna derecha extendida.", "hands": "Las palmas suben por los lados hasta delante de la cabeza (la derecha se cierra en puño) y bajan envolviendo hacia la cintura derecha, con el puño derecho dentro de la palma izquierda. La izquierda se cierra y queda en la cintura. El puño derecho se lanza al frente con el brazo extendido, de abajo arriba (撩), a la altura del abdomen y con la cara del puño hacia delante y abajo.", "body": "Tras el golpe, hombros y codos sueltos. El libro admite una versión lenta y otra rápida con sacudida del antebrazo; en la rápida la fuerza sale de cintura y piernas y el cuerpo se mantiene entero. El puño no pasa de la altura del hombro.", "cue": "Envolver · puño que sube desde abajo", "note48": ""}, "29": {"reps": "2 veces (derecha e izquierda)", "st": ["uno"], "feet": "Dos patadas con la punta del pie (分脚), derecha y luego izquierda, con el empeine estirado y a una altura superior a la cintura. Antes de cada una, el pie libre se recoge junto al de apoyo con la punta tocando el suelo (opcional). La pierna de apoyo queda semiflexionada, la rodilla sube y el pie se estira despacio. Tras la primera, el pie baja delante, el peso pasa adelante en arco y el otro pie se recoge.", "hands": "Los brazos se abren, bajan y se cruzan en el pecho en cruz diagonal con las palmas hacia dentro (derecha por fuera para la primera patada, izquierda por fuera para la segunda). En la patada, las palmas se separan en arco: una hacia delante, del lado de la pierna, y otra hacia atrás. Palmas hacia fuera, muñecas a la altura del hombro y codos algo flexionados. El brazo y la pierna del mismo lado quedan alineados en vertical.", "body": "Estable sobre la pierna de apoyo, torso recto, mirada a la mano del lado de la patada. Es como la patada de talón (蹬脚), pero con el empeine estirado y la punta al frente, sin empujar con el talón.", "cue": "Cruzar las manos · patada de empeine (derecha y luego izquierda)", "note48": ""}, "31": {"reps": "1 vez", "st": ["arco"], "feet": "El peso va atrás y la punta del pie derecho se levanta y se abre. El pie derecho se asienta, el peso pasa adelante y el pie izquierdo da un paso al frente hasta un arco izquierdo.", "hands": "La palma derecha sale por encima del antebrazo izquierdo y barra hacia la derecha en horizontal. Luego la derecha se cierra en puño en la cintura (ojo del puño arriba) y la izquierda traza un arco y se cierra delante, con el puño hacia abajo y la muñeca ganchada (扣腕, «agarre»), a la altura del hombro. Al llegar al arco, el puño derecho golpea de frente desde la cintura y el izquierdo retrocede bajo la muñeca derecha.", "body": "Los círculos de las palmas son continuos. La cintura gira primero a la derecha y luego a la izquierda para lanzar el puño derecho.", "cue": "Agarrar con la izquierda · golpear con el puño derecho", "note48": ""}, "34": {"reps": "1 vez", "st": ["arco"], "feet": "El pie izquierdo retrocede un paso en diagonal y el peso pasa al arco derecho. El peso vuelve atrás, el pie derecho se recoge con la punta apoyada junto al izquierdo y, finalmente, sale en diagonal hasta un arco derecho. Las piernas no se cruzan ni se tuercen.", "hands": "La palma derecha va al frente por encima del antebrazo izquierdo y se cierra en puño ante el vientre bajo. La izquierda traza un arco y queda con la palma hacia abajo, por dentro del antebrazo derecho. Al avanzar, el puño derecho sube por delante del pecho izquierdo y golpea al frente y arriba con el dorso del puño (撇拳), a la altura de la cabeza, mientras la palma izquierda sale pegada a su antebrazo.", "body": "Es la versión simétrica del 左撇身捶, con los mismos puntos y arco derecho.", "cue": "Cerrar el puño · golpe con el dorso (lado derecho)", "note48": ""}, "36": {"reps": "1 vez", "st": ["arco"], "feet": "El peso pasa a la pierna izquierda y la punta del pie derecho se levanta. El pie derecho pasa por dentro del izquierdo y retrocede un solo paso, y la pierna izquierda se dobla en arco izquierdo.", "hands": "La palma izquierda va a la cintura, con la palma abajo, mientras el antebrazo derecho gira hacia fuera. La derecha presiona hacia abajo, bajo el codo izquierdo, y la izquierda se gira palma arriba, se recoge a la cintura y atraviesa (穿) al frente y arriba por encima del antebrazo derecho, a la altura de los ojos.", "body": "Siéntate bien en la pierna, recoge el pie con ligereza y retrocede estable. Arriba y abajo van coordinados y las manos no van demasiado rápidas.", "cue": "Un paso atrás · palma que atraviesa a la altura de los ojos", "note48": ""}, "37": {"reps": "1 vez", "st": ["vacio"], "feet": "El peso va atrás, el pie izquierdo gira la punta hacia dentro y el cuerpo gira hacia atrás a la derecha. El peso queda en la pierna izquierda y el pie derecho se levanta y apoya la punta al frente: paso vacío derecho. Al girar, el pie derecho se ajusta un poco hacia la derecha.", "hands": "La mano derecha se recoge al abdomen y la izquierda sube sobre la frente izquierda. Luego la palma izquierda baja y presiona en horizontal sobre la rodilla derecha, con la palma abajo y el pulgar hacia dentro. La derecha presiona junto a la cadera derecha con los dedos al frente.", "body": "El torso se hunde y se inclina algo al frente, sin bajar la cabeza ni doblar la cintura. Sigue el giro con el hombro y mantén cintura y caderas sueltas.", "cue": "Paso vacío · presionar la palma sobre la rodilla", "note48": ""}, "38": {"reps": "1 vez", "st": ["uno"], "feet": "El pie izquierdo empuja el suelo y la pierna izquierda, semiflexionada, se estabiliza. La rodilla derecha sube y el pie cuelga relajado con la punta hacia abajo: equilibrio sobre la pierna izquierda.", "hands": "El torso gira a la izquierda. La palma derecha gira hacia arriba y sostiene (托) delante del cuerpo, a la altura del pecho. La izquierda traza un arco hacia arriba y se abre (撑) a un lado, a la altura del pecho, con la palma hacia fuera y los dedos oblicuos al frente y arriba.", "body": "Empujar, girar la cintura y sostener con la palma ocurren a la vez. Al final: cintura suelta, pecho recogido, hombros y codos hundidos, y respiración suave.", "cue": "Rodilla arriba · palma que sostiene hacia arriba", "note48": ""}, "39": {"reps": "1 vez", "st": ["semijinete"], "feet": "El pie derecho cae cruzado por delante del cuerpo y el peso pasa a la derecha. El pie izquierdo se recoge junto al derecho y sale un paso a la diagonal izquierda, con el talón primero, hasta el medio jinete (半马步): el pie delantero apunta al frente y el trasero hacia el lado, el peso algo en la pierna trasera, la pelvis redonda y la rodilla trasera algo hacia dentro.", "hands": "La mano derecha sube junto a la oreja con la palma arriba. La izquierda se cierra en puño y baja al pecho. El antebrazo izquierdo cae por el abdomen y sale al frente con el hombro y la parte alta del brazo (靠): el puño izquierdo queda sobre la rodilla izquierda, con la cara del puño hacia abajo. La palma derecha se apoya por dentro del codo izquierdo y empuja el brazo.", "body": "La cintura se hunde hacia delante y abajo, con el torso recto. El libro admite una versión explosiva, corta y rápida, con fuerza de cintura y piernas.", "cue": "Medio jinete · golpe de hombro con el brazo", "note48": ""}, "40": {"reps": "1 vez", "st": ["lateral"], "feet": "El peso va atrás, el pie izquierdo abre la punta y se asienta, y el derecho se junta al izquierdo (pies paralelos a unos 10 cm). Se pivota sobre la punta derecha con el talón hacia fuera, se flexiona y el pie izquierdo retrocede en diagonal. Al final, el peso va a la izquierda y el talón derecho se abre hasta una postura de arco lateral (横裆步): pies paralelos al frente y anchos como un arco, pierna izquierda flexionada y derecha estirada.", "hands": "Las palmas giran a la derecha y suben a la altura del hombro (la derecha a un lado, con la palma arriba; la izquierda doblada al frente, con la palma hacia fuera). Después las dos palmas tiran (大捋) hacia la izquierda en horizontal y se cierran en puño. El puño izquierdo queda en la cintura con la palma arriba, y el derecho al frente a la altura del pecho, con el antebrazo girando hacia fuera y bajando (滚肘).", "body": "Juntar el pie, girar, retroceder y tirar en horizontal se encadenan con la cintura como eje. La cabeza sigue el giro. Al final, el brazo derecho queda semiflexionado en arco y el peso se hunde.", "cue": "Girar · tirar en horizontal · codo que rueda", "note48": ""}, "41": {"reps": "1 vez", "st": ["tee", "bajo"], "feet": "El pie derecho se desliza medio paso detrás del izquierdo con la punta apoyada (paso en T). Después el pie derecho se asienta, el cuerpo gira a la derecha y el peso pasa a esa pierna. Por último, la pierna izquierda se extiende hacia el lado en postura baja (左仆步), con la derecha flexionada a fondo y los dos pies planos. Las personas mayores pueden hacer un semi-仆步.", "hands": "La palma derecha sube (撩) hacia delante y abajo desde fuera de la cadera derecha, a la altura del vientre bajo, con la izquierda pegada por dentro de su antebrazo. Luego la derecha sube por la derecha y se convierte en gancho (勾手), y la izquierda se recoge al hueco del codo derecho. Al final, la palma izquierda baja por delante del abdomen y atraviesa al frente por la cara interna de la pierna izquierda, con la palma hacia la derecha.", "body": "Abrir y cerrar los pies va con el giro del cuerpo, y la mano izquierda no se va demasiado atrás. Para recoger el pie, cierra la cadera y levanta la pierna con ligereza. En la postura baja, sale primero la pierna izquierda y luego se gira el torso para pasar la palma; sin bajar la cabeza ni encorvar la cintura.", "cue": "Levantar la palma · gancho · bajar y atravesar", "note48": ""}, "42": {"reps": "1 vez", "st": ["vacio"], "feet": "El peso pasa adelante, el pie izquierdo abre la punta y el derecho la gira hacia dentro: arco izquierdo con la pierna derecha estirada. Luego el pie derecho da un paso al frente y apoya la punta: paso vacío derecho.", "hands": "La palma izquierda sube y se adelanta hasta la altura del hombro, mientras el brazo derecho cae atrás con el gancho. Después la izquierda se cierra en puño y el gancho derecho se convierte en puño que sube desde atrás hacia delante y arriba. Los puños se cruzan (derecho por fuera) a la altura del hombro, con los brazos redondos.", "body": "Antes de levantarte, abre al máximo la punta izquierda y cierra hacia dentro la derecha. Al subir, cierra la cadera y avanza con paso ligero y estable. Al final, hombros y caderas sueltos.", "cue": "Paso vacío · puños cruzados", "note48": ""}, "43": {"reps": "1 vez", "st": ["uno"], "feet": "El pie derecho retrocede un paso hacia el lado derecho y el peso va atrás. El pie izquierdo se levanta y se mueve algo a la derecha (paso vacío izquierdo). Después la pierna derecha empuja el suelo y queda de pie, semiflexionada, con la pierna izquierda levantada al frente, casi estirada (rodilla algo flexionada), el pie relajado y la punta algo hacia dentro.", "hands": "Los puños se abren. La izquierda baja y presiona junto a la cadera izquierda, y la derecha pasa por delante de la cabeza y cae sobre el muslo izquierdo. Al final, la palma derecha sube al frente (挑掌), con la palma hacia la izquierda y la muñeca a la altura del hombro. La mano izquierda forma un gancho (勾手) y se eleva atrás a la altura del hombro.", "body": "El torso se gira a la izquierda, mirando hacia la diagonal izquierda. La mano derecha y el pie izquierdo quedan más o menos alineados en vertical. La altura de la pierna depende de cada persona; el cuerpo se mantiene natural y suelto.", "cue": "Una pierna · palma que sube, gancho atrás", "note48": ""}, "44": {"reps": "1 vez", "st": ["uno"], "feet": "El pie izquierdo cae cruzado, con la punta hacia dentro, por fuera del derecho. Se gira unos 270° a la derecha pivotando sobre las puntas de los dos pies, con las piernas semiflexionadas y sin alejar el pie de giro. El pie derecho se levanta y barre en abanico hacia fuera, de izquierda a derecha, con el empeine estirado.", "hands": "El gancho izquierdo se abre en palma y barre en horizontal. La derecha pasa por debajo del codo izquierdo. Después las dos palmas barren de derecha a izquierda ante el cuerpo y golpean el empeine derecho: primero la izquierda y luego la derecha (dos palmadas).", "body": "El torso no debe tambalearse, y los brazos barren con el giro. Al patear, la pierna derecha sube y el torso se inclina un poco al frente, sin tensión. Con equilibrio débil o edad avanzada, se puede omitir la palmada al pie.", "cue": "Girar 270° · barrido de pierna · dos palmadas al pie", "note48": ""}, "45": {"reps": "1 vez", "st": ["arco"], "feet": "El pie derecho se recoge al lado, con la pierna izquierda semiflexionada de apoyo, y luego cae a un lado. El peso pasa a la pierna derecha en arco derecho (dirección ligeramente hacia atrás-derecha).", "hands": "Las dos palmas oscilan a la izquierda y luego bajan, trazan un arco a la derecha y se cierran en puño. Después el torso gira a la izquierda y el puño izquierdo golpea hacia la diagonal izquierda por delante de la cara, a la altura de la nariz, con la cara del puño oblicua hacia delante y abajo. El puño derecho se recoge doblando el codo delante de la frente derecha, con el puño hacia fuera.", "body": "Al balancear las manos a la derecha, cabeza y cintura las siguen y la mirada va al puño derecho. Al terminar, la cintura se hunde y   function seqFor(F, n) {
    const i = F.moves.findIndex(x => x.n === n), m = F.moves[i], key = m.ex ? m.f24 : (F.id === 'f48' ? 100 + n : 0), fr = FIG.frames[key];

  /* ---------- INTRODUCCIÓN ---------- */
  function renderIntro() {
    app.innerHTML = `<div class="wrap screen" style="padding-bottom:110px">
      <header class="top"><button class="icon-btn" id="xb" aria-label="Volver">${ICON.back}</button><div class="kicker">Introducción</div><div style="width:46px"></div></header>
      <div class="card"><h2 style="margin-top:0">Qué es el Tai Chi</h2>
        <p>El <b>Tai Chi</b> (太极拳, <i>Taijiquan</i>, «puño de la gran polaridad») nació como arte marcial. Según la tradición, se desarrolló hacia el siglo XVII en la aldea de Chenjiagou (Henan, China), en la familia Chen. De ahí salieron los demás estilos familiares, y en el siglo XX se difundió sobre todo como práctica de salud: movimientos lentos y continuos, respiración tranquila y atención al equilibrio.</p>
        <p style="margin-bottom:0">Dentro de cada estilo conviven formas muy distintas: desde secuencias de 8 a 24 movimientos hasta formas tradicionales de más de 100. El número de posturas no es un capricho: responde al estilo, al objetivo (salud, combate o competición) y a la escuela.</p></div>
      <div class="card"><h3>Los cinco estilos familiares</h3>
        <div class="oitem" style="border-top:0"><b>Chen · 陈</b><span>El más antiguo y el de enfoque marcial más explícito. Alterna movimientos lentos con explosiones de fuerza (<i>fajin</i>), usa la «energía de enrollar seda» (espirales) y posturas bajas. Sus rutas tradicionales son la primera (<i>Yi Lu</i>) y la segunda, más rápida y explosiva (<i>Er Lu</i>, «puño de cañón»).</span></div>
        <div class="oitem"><b>Yang · 杨</b><span>El más extendido. Lento, continuo, de amplitud media y con posturas erguidas. Su forma tradicional larga ronda las 85–108 posturas según cómo se cuenten. <b>La forma de 24 de esta app es una simplificación de este estilo.</b></span></div>
        <div class="oitem"><b>Wu · 吴</b><span>Posturas más compactas que las del Yang, con el tronco ligeramente inclinado y mucho énfasis en asentarse y echar raíz.</span></div>
        <div class="oitem"><b>Wu/Hao · 武/郝</b><span>El menos conocido. Movimientos pequeños y precisos, cuerpo muy erguido y posiciones altas; trabaja el equilibrio interno y la sensibilidad.</span></div>
        <div class="oitem"><b>Sun · 孙</b><span>Creado por Sun Lutang, que también dominaba otras artes internas. Es el más ligero y ágil: posturas altas, pasos cortos y círculos pequeños.</span></div></div>
      <div class="card"><h3>Formas tradicionales y estandarizadas</h3>
        <p><b>Tradicionales.</b> Son las secuencias originales de cada familia, transmitidas de generación en generación. Suelen ser largas (de 80–100 movimientos en adelante), llevan meses o años de aprendizaje e incluyen las aplicaciones marciales.</p>
        <p style="margin-bottom:0"><b>Estandarizadas.</b> Se crearon en el siglo XX, desde 1956, para regularizar y popularizar la práctica con fines de salud. La <b>de 24</b> simplifica el estilo Yang y es el punto de entrada habitual (5–6 minutos). La <b>de 48</b> (hacia 1976) combina Chen, Yang, Wu y Sun y es más exigente. La <b>de 42</b> se creó para competición.</p></div>

        <div class="oitem"><b>Largas (48 en adelante)</b><span>Inmersión más profunda: más movimientos, transiciones y repeticiones. A cambio, el aprendizaje se mide en meses o años y piden más tiempo y espacio.</span></div>
        <p class="muted" style="font-size:14px;margin:10px 0 0">La elección depende de tu objetivo y de tu tiempo. No hay una forma «mejor» en abstracto.</p></div>
      <div class="card"><h3>Qué hay en esta app</h3><ul class="ticks">
        <li><b>Forma de 24:</b> la ruta de 84 días, el núcleo de la app.</li>

      <div class="card"><h3>Fuentes y límites</h3><p style="font-size:14.5px;margin:0">Texto de partida aportado por Luis, revisado y contrastado con la lista <a href="https://en.wikipedia.org/wiki/List_of_tai_chi_forms" target="_blank" rel="noopener">List of tai chi forms</a>. Se han omitido recuentos de movimientos que no he podido verificar (por ejemplo, de las rutas de Chen y de las formas Hao y Sun). Las fechas son aproximadas y los orígenes históricos, tradicionales.</p></div>
      <button class="btn small" id="x8" style="margin-bottom:8px">Ver la mini-forma de 8</button>

      <header class="top"><button class="icon-btn" id="sq" aria-label="Salir">${ICON.back}</button><div class="kicker">${F.name} · ${S.i + 1} de ${tot}</div><div style="width:46px"></div></header>
      <div class="bar thin"><i style="width:${(S.i / tot) * 100}%"></i></div>
      <div class="timer"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" class="tbg"/><circle cx="60" cy="60" r="${R}" class="tfg" id="tfg" stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg><div class="tt"><b id="tt">${mmss(S.secs)}</b><small>${m.n} / ${F.moves.length}</small></div></div>
      <div class="card" style="text-align:center">
        ${seq ? `<div class="anim" style="margin:0 0 8px"><div class="afig"></div><div class="acap"></div></div>` : `<div class="pfig"><div class="hz big">${m.zh}</div><div class="py">${m.py}</div></div>`}
        <h2 style="margin:4px 0 2px">${m.n}. ${m.es}</h2><div class="muted" style="font-size:14px">${m.zh} · ${m.py}</div>
        ${m.cue ? `<p class="cue" style="min-height:0;margin:10px 0 0">${m.cue}</p>` : ''}
        ${!seq ? `<p class="muted" style="font-size:13.5px;margin:10px 0 0">Sin figura animada en la app.</p>` : ''}
        ${m.chk ? `<p class="muted" style="font-size:13px;margin:8px 0 0">⚠ Por confirmar: la lista pública da «${m.chk}».</p>` : ''}</div>
      <div class="row" style="margin-top:14px"><button class="btn small" id="spz">${S.run ? 'Pausa' : 'Seguir'}</button><button class="btn small" id="snx">${S.i < tot - 1 ? 'Siguiente' : 'Terminar'}</button></div>
      <button class="btn ghost small" id="sq2" style="margin-top:8px">Salir</button></div>`;
    if (!wl) wake();
    if (seq) playSeq($('.afig'), $('.acap'), seq, () => !S || !S.run);
    const tt = $('#tt'), fg = $('#tfg');
    addAnim({ tick(dt) {
      if (!tt.isConnected) return false;
      if (!S || !S.run) return;
      S.el += dt;
      if (S.el >= S.secs) { advance(); return false; }
      tt.textContent = mmss(S.secs - S.el);
      fg.setAttribute('stroke-dashoffset', (C * S.el / S.secs).toFixed(1));
    } });
    const quit = () => { unwake(); const F2 = S.F; S = null; go('x_form_' + F2.id); };
    $('#sq').onclick = $('#sq2').onclick = quit;
    $('#spz').onclick = e => { S.run = !S.run; e.target.textContent = S.run ? 'Pausa' : 'Seguir'; };
    $('#snx').onclick = advance;
  }
  function advance() {
    if (!S) return;
    if (store.sound) tone(262, .5, .08);
    if (S.i < S.list.length - 1) { S.i++; S.el = 0; S.run = true; renderSess(); } else finishSess();
  }
  function finishSess() {
    const F = S.F, list = S.list.slice(); S = null; unwake();
    const dv = sheet(`<h2>Sesión terminada</h2><p class="lead">Has recorrido ${list.length} movimiento${list.length === 1 ? '' : 's'} de la ${F.name.toLowerCase()}. Verla pasar no es lo mismo que saberla: marca como aprendidos solo los que ya te salen sin guía.</p>
      <button class="btn primary" id="ok">Marcar estos ${list.length} como aprendidos</button><button class="btn ghost small" id="no" style="margin-top:6px">Ahora no</button>`);
    $('#ok', dv).onclick = () => { const a = doneOf(F); list.forEach(n => { if (!a.includes(n)) a.push(n); }); save(); dv.remove(); go('x_form_' + F.id); };
    $('#no', dv).onclick = () => { dv.remove(); go('x_form_' + F.id); };
    dv.onclick = e => { if (e.target === dv) { dv.remove(); go('x_form_' + F.id); } };
  }

  function render() {
    if (screen === 'x_intro') return renderIntro();
    if (screen === 'x_form_f8') return renderForm(FORMS.f8);
    if (screen === 'x_form_f48') return renderForm(FORMS.f48);
    if (screen === 'x_sess_f8' || screen === 'x_sess_f48') return renderSess();
    go('f_home');
  }
  return { render, sanitize, FORMS };
})();

/* =====================================================================
   ARRANQUE
   ===================================================================== */
render();

</script></body></html>
